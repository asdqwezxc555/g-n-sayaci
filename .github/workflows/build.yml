name: Modu Derle

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Modu derle
        run: gradle build

      - name: Jar dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: gunsayaci-jar
          path: build/libs/*.jar
